# 本番 Turso DB の毎日のバックアップ。
# 毎日 3:00（日本時間）に全データを SQL に書き出し → 空の DB に流し込んで検証 → 暗号化して
# このワークフローの成果物（Artifacts）として 30 日保存する。
#
# 必要なリポジトリの Secrets（Settings → Secrets and variables → Actions）:
#   TURSO_DATABASE_URL  本番 DB の URL（libsql://...）
#   TURSO_AUTH_TOKEN    読み取り専用トークン（turso db tokens create <db> --read-only）
#   BACKUP_PASSPHRASE   暗号化のパスフレーズ（長いランダム文字列。社長が別途保管）
#
# このリポジトリは公開なので、ログに件数や中身を出さない。保存するのは暗号化したファイルだけ。
# 復元手順: docs/roadmap/復元手順.md
name: DB backup

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 3:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$TURSO_DATABASE_URL" ] || missing="$missing TURSO_DATABASE_URL"
          [ -n "$TURSO_AUTH_TOKEN" ] || missing="$missing TURSO_AUTH_TOKEN"
          [ -n "$BACKUP_PASSPHRASE" ] || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then echo "::error::Secrets が未設定です:$missing"; exit 1; fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then echo "::error::BACKUP_PASSPHRASE は20文字以上にしてください"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall（prisma generate）は不要なので飛ばす。
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dump database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          echo "STAMP=$(TZ=Asia/Tokyo date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
          node scripts/backup_dump.mjs "$RUNNER_TEMP/backup/dump.sql" "$RUNNER_TEMP/backup/counts.json"

      - name: Verify dump restores cleanly
        run: python3 scripts/backup_verify.py "$RUNNER_TEMP/backup/dump.sql" "$RUNNER_TEMP/backup/counts.json"

      - name: Compress and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          cd "$RUNNER_TEMP/backup"
          out="dev-db-$STAMP.sql.gz.gpg"
          gzip -9 dump.sql
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$out" dump.sql.gz
          # 暗号化したファイルが同じパスフレーズで元に戻ることを確かめる。
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            -d "$out" | cmp - dump.sql.gz
          rm -f dump.sql.gz counts.json
          mkdir -p upload && mv "$out" upload/
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "size: $(du -h "upload/$out" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: dev-db-${{ env.STAMP }}
          path: ${{ runner.temp }}/backup/upload/${{ env.OUT }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/backup"
